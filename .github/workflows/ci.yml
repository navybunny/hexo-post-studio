name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 这个工具主要给本地写博客的人用，Windows 和 macOS 是主力
          # （顺带说明：没人会在 Ubuntu 服务器上写博客，但 linux 还是cover一下）
          - os: windows-latest
            node: '20'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
          - os: ubuntu-latest
            node: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        shell: bash
        run: |
          set -e
          for f in bin/*.js server/*.js public/*.js test/*.js scripts/*.js; do
            [ -e "$f" ] || continue
            echo "check $f"
            node --check "$f"
          done

      - name: 自动化测试
        run: node test/ci.js

      - name: 检查 npm 包内容
        shell: bash
        run: |
          npm pack --dry-run
          echo "---- 确认没有把不该进包的文件打进去 ----"
          if npm pack --dry-run 2>&1 | grep -Eq 'node_modules|\.github|docs/selftest'; then
            echo "::error::npm 包里混进了不该有的文件"
            exit 1
          fi
